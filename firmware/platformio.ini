; ==============================================================================
; AutoMoto Firmware — PlatformIO Yapılandırma Dosyası
; ESP32-S3-WROOM-1U-N16R8 (16MB Flash, 8MB Octal PSRAM)
; Hibrit ESP-IDF Mimari Desteği
; ==============================================================================

[platformio]
default_envs = esp32s3_automoto
src_dir = main

[env:esp32s3_automoto]
platform = espressif32
framework = espidf
board = esp32-s3-devkitc-1

; Donanım Özellikleri (16MB Flash & 8MB Octal OPI PSRAM)
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
board_build.partitions = partitions.csv

; Seri Monitör ve Yükleme Portları
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, direct
upload_speed = 921600

; Derleme Seçenekleri
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DLOG_LOCAL_LEVEL=ESP_LOG_INFO
    -DCONFIG_NIMBLE_ENABLED=1

; sdkconfig varsayılan ayarları
custom_sdkconfig_defaults = sdkconfig.defaults
